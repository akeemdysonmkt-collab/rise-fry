# One-click setup on Render (render.com): a web service, a PostgreSQL database, and the daily job.
# Fill in the secret values in the Render dashboard; never commit them.
databases:
  - name: rise-db
    plan: basic-256mb
    databaseName: rise
    user: rise

services:
  - type: web
    name: rise-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py setup_rise
    startCommand: gunicorn core.wsgi --workers 3 --timeout 60 --access-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: rise-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: RISE_PROXY_SSL_HEADER
        value: HTTP_X_FORWARDED_PROTO
      - key: RISE_CLIENT_IP_HEADER
        value: HTTP_X_FORWARDED_FOR
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: RISE_SITE_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RISE_INTAKE_CONFIG
        sync: false
      - key: RISE_FIELD_KEY
        sync: false
      - key: RISE_CONCERN_RECIPIENT_EMAILS
        sync: false
      - key: RISE_OPERATIONS_ALERT_EMAILS
        sync: false

  - type: cron
    name: rise-daily
    runtime: python
    schedule: "5 4 * * *"   # 12:05 a.m. Eastern (04:05 UTC)
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_daily
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: rise-db, property: connectionString }
      - fromGroup: rise-secrets   # create this group in Render with the same secret values as the web service
